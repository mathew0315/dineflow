services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dineflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dineflow}
      POSTGRES_DB: dineflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dineflow"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://dineflow:${POSTGRES_PASSWORD:-dineflow}@db:5432/dineflow
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
