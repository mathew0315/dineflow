[project]
name = "dineflow"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
# E/F 基本錯誤、I import 排序、B 常見 bug、UP 新語法、S bandit 資安規則
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]  # FastAPI 的 Depends() 寫在預設參數是官方用法

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]  # 測試可用 assert 與假密碼
"app/schemas.py" = ["S105"]  # token_type="bearer" 不是密碼

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
